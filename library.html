<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Meal Planner">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <title>Meal Library</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
</head>
<body>
    <div class="header-buttons">
        <a href="planner.html"><button>Weekly Planner</button></a>
        <a href="library.html"><button>Meal Library</button></a>
        <a href="shopping.html"><button>Shopping List</button></a>
        

    </div>

    <button id="themeButton" aria-label="Change theme">🎨</button>

    <div id="themeOptions">
        <button data-theme="coffee">☕ Coffee</button>
        <button data-theme="sage">🌿 Sage</button>
        <button data-theme="ocean">🌊 Ocean</button>
        <button data-theme="berry">🍓 Berry</button>
        <button data-theme="night">🌙 Night Cafe</button>
        <button data-theme="red">🍷 Felicity</button>
    </div>


    <button id="addMealButton">Add Meal</button>

    <div id="addMealForm" style="display: none;">
        <h2>Add New Meal</h2>

        <input type="text" id="newMealName" placeholder="Enter Meal Name">

        <div class="tagSection">
            <button type="button" id="toggleTagsButton" class="tagToggle">
                <span>Tags</span>
                <span id="tagArrow">▼</span>
            </button>

            <div id="mealTags" class="tagOptions collapsed">
                <label>
                    <input type="checkbox" class="mealTag" value="Lunch">
                    <span>Lunch</span>
                </label>

                <label>
                    <input type="checkbox" class="mealTag" value="Dinner">
                    <span>Dinner</span>
                </label>

                <label>
                    <input type="checkbox" class="mealTag" value="Vegetarian">
                    <span>Vegetarian</span>
                </label>

                <label>
                    <input type="checkbox" class="mealTag" value="Vegan">
                    <span>Vegan</span>
                </label>

                <label>
                    <input type="checkbox" class="mealTag" value="High Protein">
                    <span>High Protein</span>
                </label>

                <label>
                    <input type="checkbox" class="mealTag" value="Healthy">
                    <span>Healthy</span>
                </label>

                <label>
                    <input type="checkbox" class="mealTag" value="Quick">
                    <span>Quick</span>
                </label>

                <label>
                    <input type="checkbox" class="mealTag" value="Cheap">
                    <span>Cheap</span>
                </label>

                <label>
                    <input type="checkbox" class="mealTag" value="Easy">
                    <span>Easy</span>
                </label>

                <label>
                    <input type="checkbox" class="mealTag" value="Meal Prep">
                    <span>Meal Prep</span>
                </label>

                <label>
                    <input type="checkbox" class="mealTag" value="Freezer Friendly">
                    <span>Freezer Friendly</span>
                </label>

                <label>
                    <input type="checkbox" class="mealTag" value="Family Favourite">
                    <span>Family Favourite</span>
                </label>

                <label>
                    <input type="checkbox" class="mealTag" value="Comfort Food">
                    <span>Comfort Food</span>
                </label>

                <label>
                    <input type="checkbox" class="mealTag" value="One Pot">
                    <span>One Pot</span>
                </label>

                <label>
                    <input type="checkbox" class="mealTag" value="Leftovers">
                    <span>Leftovers</span>
                </label>

                <label>
                    <input type="checkbox" class="mealTag" value="Crockpot">
                    <span>Crockpot</span>
                </label>
            </div>
        </div>

        <div class="ingredientsSection">
            <h3>Ingredients</h3>

            <div id="newMealIngredients"></div>

            <button type="button" id="addIngredientButton">
                + Add Ingredient
            </button>
        </div>

        <div class= "mealLinksSection">
            <h3>Links</h3>

            <input
                type="url"
                id="newMealVideoLink"
                placeholder="Insta Link (optional)"
            >
        </div>

        <div class="modalButtons">
            <button id="cancelMealButton">Cancel</button>
            <button id="saveMealButton">Save</button>
        </div>
    </div>

    <h2>Your Meals</h2>
    <div id="mealList"></div>

    <div id="editMealModal" class="mealModal">
        <div class="modalContent">
            <h2>Edit Meal</h2>

            <input
                type="text"
                id="editMealName"
                placeholder="Meal name"
            >

            <div class="tagSection">
                <button type="button" id="toggleEditTagsButton" class="tagToggle">
                    <span>Tags</span>
                    <span id="editTagArrow">▼</span>
                </button>

                <div id="editMealTags" class="tagOptions collapsed">

                    <label>
                        <input type="checkbox" class="editMealTag" value="Lunch">
                        <span>Lunch</span>
                    </label>

                    <label>
                        <input type="checkbox" class="editMealTag" value="Dinner">
                        <span>Dinner</span>
                    </label>

                    <label>
                        <input type="checkbox" class="editMealTag" value="Vegetarian">
                        <span>Vegetarian</span>
                    </label>

                    <label>
                        <input type="checkbox" class="editMealTag" value="Vegan">
                        <span>Vegan</span>
                    </label>

                    <label>
                        <input type="checkbox" class="editMealTag" value="High Protein">
                        <span>High Protein</span>
                    </label>

                    <label>
                        <input type="checkbox" class="editMealTag" value="Healthy">
                        <span>Healthy</span>
                    </label>

                    <label>
                        <input type="checkbox" class="editMealTag" value="Quick">
                        <span>Quick</span>
                    </label>

                    <label>
                        <input type="checkbox" class="editMealTag" value="Cheap">
                        <span>Cheap</span>
                    </label>

                    <label>
                        <input type="checkbox" class="editMealTag" value="Easy">
                        <span>Easy</span>
                    </label>

                    <label>
                        <input type="checkbox" class="editMealTag" value="Meal Prep">
                        <span>Meal Prep</span>
                    </label>

                    <label>
                        <input type="checkbox" class="editMealTag" value="Freezer Friendly">
                        <span>Freezer Friendly</span>
                    </label>

                    <label>
                        <input type="checkbox" class="editMealTag" value="Family Favourite">
                        <span>Family Favourite</span>
                    </label>

                    <label>
                        <input type="checkbox" class="editMealTag" value="Comfort Food">
                        <span>Comfort Food</span>
                    </label>

                    <label>
                        <input type="checkbox" class="editMealTag" value="One Pot">
                        <span>One Pot</span>
                    </label>

                    <label>
                        <input type="checkbox" class="editMealTag" value="Leftovers">
                        <span>Leftovers</span>
                    </label>

                    <label>
                        <input type="checkbox" class="editMealTag" value="Crockpot">
                        <span>Crockpot</span>
                    </label>
                </div>
            </div>

            <div class="ingredientsSection">
                <h3>Ingredients</h3>

                <div id="editMealIngredients"></div>

                <button type="button" id="addEditIngredientButton">
                    + Add Ingredient
                </button>
            </div>

            <div class="mealLinksSection">

                <h3>Recipe & Video Links</h3>

                <input
                    type="url"
                    id="editMealVideoLink"
                    placeholder="Insta link (optional)"
                >

            </div>

            <div class="modalButtons">
                <button id="cancelEditButton">Cancel</button>
                <button id="saveEditButton">Save Changes</button>
            </div>
        </div>
    </div>

    <div id="deleteMealModal" class="mealModal">
        <div class="modalContent">
            <h2>Delete Meal?</h2>

            <p id="deleteMealMessage"></p>

            <div class="modalButtons">
                <button id="cancelDeleteButton">Cancel</button>
                <button id="confirmDeleteButton">Delete</button>
            </div>
        </div>
    </div>

    <div id="ingredientsModal" class="mealModal">
        <div class="modalContent">
            <h2 id="ingredientsModalTitle">Ingredients</h2>

            <div id="ingredientsList"></div>

            <button id="closeIngredientsButton">
                Close
            </button>
        </div>
    </div>

    <script src="Ingredient-normalizer.js"></script>
    <script src="library.js"></script>
    <script src="theme.js"></script>
</body>
</html>

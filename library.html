<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meal Library</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
</head>
<body>
    <h1>Meal Library</h1>

    <div class="header-buttons">
        <a href="index.html"><button>Weekly Planner</button></a>
        <a href="library.html"><button>Meal Library</button></a>
    </div>

    <button id="addMealButton">Add Meal</button>

    <div id="addMealForm" style="display: none;">
        <h2>Add New Meal</h2>

        <input type="text" id="newMealName" placeholder="Enter Meal Name">

        <h3>Tags</h3>

        <label>
            <input type="checkbox" class="mealTag" value="Vegetarian">
            Vegetarian
        </label>
        <br>

        <label>
            <input type="checkbox" class="mealTag" value="Vegan">
            Vegan
        </label>
        <br>

        <label>
            <input type="checkbox" class="mealTag" value="High Protein">
            High Protein
        </label>
        <br>

        <label>
            <input type="checkbox" class="mealTag" value="Healthy">
            Healthy
        </label>
        <br>

        <label>
            <input type="checkbox" class="mealTag" value="Quick">
            Quick
        </label>
        <br>

        <label>
            <input type="checkbox" class="mealTag" value="Cheap">
            Cheap
        </label>
        <br>

        <label>
            <input type="checkbox" class="mealTag" value="Easy">
            Easy
        </label>
        <br>

        <label>
            <input type="checkbox" class="mealTag" value="Meal Prep">
            Meal Prep
        </label>
        <br>

        <label>
            <input type="checkbox" class="mealTag" value="Freezer Friendly">
            Freezer Friendly
        </label>
        <br>

        <label>
            <input type="checkbox" class="mealTag" value="Family Favourite">
            Family Favourite
        </label>
        <br>

        <label>
            <input type="checkbox" class="mealTag" value="Comfort Food">
            Comfort Food
        </label>
        <br>

        <label>
            <input type="checkbox" class="mealTag" value="One Pot">
            One Pot
        </label>
        <br>

        <label>
            <input type="checkbox" class="mealTag" value="Leftovers">
            Leftovers
        </label>
        <br>



        <br><br>

        <button id="cancelMealButton">Cancel</button>
        <button id="saveMealButton">Save</button>
    </div>

    <h2>Your Meals</h2>
    <div id="mealList"></div>

    <div id="editMealModal" class="mealModal">
        <div class="modalContent">
            <h2>Edit Meal</h2>

            <input
                type="text"
                id="editMealName"
                placeholder="Meal name"
            >

            <h3>Categories</h3>

            <div id="editMealTags">

                <label>
                    <input type="checkbox" class="editMealTag" value="Vegetarian">
                    Vegetarian
                </label>

                <label>
                    <input type="checkbox" class="editMealTag" value="Vegan">
                    Vegan
                </label>

                <label>
                    <input type="checkbox" class="editMealTag" value="High Protein">
                    High Protein
                </label>

                <label>
                    <input type="checkbox" class="editMealTag" value="Healthy">
                    Healthy
                </label>

                <label>
                    <input type="checkbox" class="editMealTag" value="Quick">
                    Quick
                </label>

                <label>
                    <input type="checkbox" class="editMealTag" value="Cheap">
                    Cheap
                </label>

                <label>
                    <input type="checkbox" class="editMealTag" value="Easy">
                    Easy
                </label>

                <label>
                    <input type="checkbox" class="editMealTag" value="Meal Prep">
                    Meal Prep
                </label>

                <label>
                    <input type="checkbox" class="editMealTag" value="Freezer Friendly">
                    Freezer Friendly
                </label>

                <label>
                    <input type="checkbox" class="editMealTag" value="Family Favourite">
                    Family Favourite
                </label>

                <label>
                    <input type="checkbox" class="editMealTag" value="Comfort Food">
                    Comfort Food
                </label>

                <label>
                    <input type="checkbox" class="editMealTag" value="One Pot">
                    One Pot
                </label>

                <label>
                    <input type="checkbox" class="editMealTag" value="Leftovers">
                    Leftovers
                </label>

            </div>

            <div class="modalButtons">
                <button id="cancelEditButton">Cancel</button>
                <button id="saveEditButton">Save Changes</button>
            </div>
        </div>
    </div>



    <div id="deleteMealModal" class="mealModal">
        <div class="modalContent">
            <h2>Delete Meal?</h2>

            <p id="deleteMealMessage"></p>

            <div class="modalButtons">
                <button id="cancelDeleteButton">Cancel</button>
                <button id="confirmDeleteButton">Delete</button>
            </div>
        </div>
    </div>



    <script src="library.js"></script>
    <script src ="theme.js"></script>
</body>
</html>
